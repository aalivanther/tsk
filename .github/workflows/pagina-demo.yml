name: Pagina demo

# Solo manual: la demo publicada sale de Akyrion/demos/tsk (verificada en local y con la barra del
# portafolio inyectada) y se sube a la rama gh-pages. Este flujo queda para regenerarla en CI si hace falta.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: node web/scripts/build-demo.mjs
        env:
          # Ruta bajo la que se sirve la demo dentro del dominio del portafolio.
          DEMO_BASE_PATH: /tsk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pagina
      - id: deployment
        uses: actions/deploy-pages@v4
